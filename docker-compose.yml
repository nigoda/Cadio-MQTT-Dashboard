version: '3.8'

services:
  nivixsa-smart-agriculture:
    build: .
    container_name: nivixsa-smart-agriculture
    restart: always
    ports:
      - "5000:5000"
    environment:
      - TZ=UTC # Change to your timezone, e.g., America/New_York
    volumes:
      # Mount the database files and keys back to the host system so they survive restarts
      - ./cadio.db:/app/cadio.db
      - ./cadio.db-wal:/app/cadio.db-wal
      - ./cadio.db-shm:/app/cadio.db-shm
      - ./.encryption_key:/app/.encryption_key
      - ./.env:/app/.env
